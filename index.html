<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OnlineCAD: free parametric 3D CAD in your browser. Sketch, extrude, sculpt, generate parts with AI, and export for 3D printing." />
    <meta name="theme-color" content="#0d0f13" />
    <meta property="og:title" content="OnlineCAD" />
    <meta property="og:description" content="Free parametric 3D CAD in your browser." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OnlineCAD</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      try {
        var t = localStorage.getItem('onlinecad.theme') || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
